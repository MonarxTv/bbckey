<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; margin:0; padding:0; }

body {
  font-family: 'Montserrat', sans-serif;
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  color: #fff;
  min-height: 100vh;
  padding: 20px 0;
}

/* TITLE */
h1 {
  text-align: center;
  font-size: 2rem;
  font-weight: 800;
  background: linear-gradient(90deg, #ff6a00, #ee0979);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 20px;
}

/* SEARCH BAR */
.search-bar {
  width: 90%;
  max-width: 400px;
  margin: 0 auto 20px auto;
}

.search-bar input {
  width: 100%;
  padding: 12px 16px;
  font-size: 14px;
  border-radius: 25px;
  border: none;
  outline: none;
  background: rgba(255,255,255,0.05);
  color: #fff;
}

/* SCROLL ROW */
.horizontal-scroll {
  display: flex;
  overflow-x: auto;
  gap: 12px;
  padding: 10px 10px 20px 10px;
}

.horizontal-scroll::-webkit-scrollbar { height:6px; }
.horizontal-scroll::-webkit-scrollbar-thumb {
  background: linear-gradient(45deg, #ff6a00, #ee0979);
  border-radius:4px;
}

/* GRID */
.grid {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding: 0 10px 20px 10px;
  justify-content: center;
}

/* MOVIE CARD */
.movie-card {
  background: linear-gradient(145deg, #1a1f3a, #101426);
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  width: 48%;
  height: 280px;
  transition: 0.3s;
}

.movie-card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
}

.movie-card .info {
  padding: 8px;
  display:flex;
  justify-content:center;
  align-items:center;
}

.movie-card h3 {
  font-size: 16px;
  color: #1e90ff;
  text-align:center;
}

/* ACTOR CARD */
.actor-card {
  width: 120px;
  min-width: 120px;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  transition: 0.3s;
}

.actor-card img {
  width: 100%;
  height: 240px;
  object-fit: cover;
}

.actor-name {
  text-align:center;
  font-size:12px;
  padding:6px;
  color:#ff6a00;
}

/* CATEGORY */
.category-card {
  width: 80px;
  border-radius: 12px;
  text-align:center;
  padding:6px;
  color:#ffd700;
  cursor:pointer;
  background: rgba(255,255,255,0.05);
}

/* HOVER */
.movie-card:hover {
  transform: translateY(-6px) scale(1.03);
}
.actor-card:hover {
  transform: scale(1.05);
}
.category-card:hover {
  transform: scale(1.05);
}
</style>
</head>

<body>

<h1>🎬 KEYBBC.xyz</h1>

<div class="search-bar">
  <input type="text" id="search" placeholder="Kino, actor yoki category...">
</div>

<div class="horizontal-scroll" id="actors-results"></div>
<div class="horizontal-scroll" id="categories-results"></div>
<div class="grid" id="movies-results"></div>

<script src="data.js"></script>

<script>
const searchInput = document.getElementById("search");
const moviesContainer = document.getElementById("movies-results");
const actorsContainer = document.getElementById("actors-results");
const categoriesContainer = document.getElementById("categories-results");

function renderResults() {
  const q = searchInput.value.toLowerCase();

  /* 🎬 MOVIES FILTER */
  const filteredMovies = movies.filter(m =>
    m.title.toLowerCase().includes(q) ||
    m.actors.some(a => a.name.toLowerCase().includes(q))
  );

  moviesContainer.innerHTML = "";
  filteredMovies.forEach(m => {
    const div = document.createElement("div");
    div.className = "movie-card";
    div.innerHTML = `
      <img src="${m.thumbnail}">
      <div class="info"><h3>${m.title}</h3></div>
    `;
    div.onclick = () => location.href = `list.html?id=${m.id}`;
    moviesContainer.appendChild(div);
  });

  /* 👤 ACTORS (FROM MOVIES ONLY) */
  const actorsSet = new Set();
  movies.forEach(m => m.actors.forEach(a => actorsSet.add(JSON.stringify(a))));
  const actors = Array.from(actorsSet).map(a => JSON.parse(a));

  const filteredActors = actors.filter(a =>
    a.name.toLowerCase().includes(q)
  );

  actorsContainer.innerHTML = "";
  filteredActors.forEach(a => {
    const div = document.createElement("div");
    div.className = "actor-card";
    div.innerHTML = `
      <img src="${a.image}">
      <div class="actor-name">${a.name}</div>
    `;
    div.onclick = () => location.href = `actors.html?name=${encodeURIComponent(a.name)}`;
    actorsContainer.appendChild(div);
  });

  /* 🎭 CATEGORIES (FROM MOVIES ONLY) */
  const categoriesSet = new Set();
  movies.forEach(m => m.categories.forEach(c => categoriesSet.add(c)));

  const filteredCategories = Array.from(categoriesSet).filter(c =>
    c.toLowerCase().includes(q)
  );

  categoriesContainer.innerHTML = "";
  filteredCategories.forEach(c => {
    const div = document.createElement("div");
    div.className = "category-card";
    div.textContent = c;
    div.onclick = () => location.href = `kategory.html?cat=${encodeURIComponent(c)}`;
    categoriesContainer.appendChild(div);
  });
}

searchInput.addEventListener("input", renderResults);
renderResults();
</script>

</body>
</html>
