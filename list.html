<!DOCTYPE html>
<html lang="uz">
<head>
  <meta http-equiv="Delegate-CH" content="Sec-CH-UA https://s.magsrv.com; Sec-CH-UA-Mobile https://s.magsrv.com; Sec-CH-UA-Arch https://s.magsrv.com; Sec-CH-UA-Model https://s.magsrv.com; Sec-CH-UA-Platform https://s.magsrv.com; Sec-CH-UA-Platform-Version https://s.magsrv.com; Sec-CH-UA-Bitness https://s.magsrv.com; Sec-CH-UA-Full-Version-List https://s.magsrv.com; Sec-CH-UA-Full-Version https://s.magsrv.com;">
<meta charset="UTF-8">
<title>Movie Details</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family:'Montserrat', sans-serif;
  background:#121212;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:10px;
  width:100%;
}

/* === ACTORS SECTION === */
.actors-section {
  display:inline-flex;
  gap:10px;
  overflow-x:auto;
  padding:10px 0;
  margin-bottom:15px;
  scroll-behavior:smooth;
  justify-content:flex-start;
  align-items:flex-start;
  min-width:100%;
}
.actors-section::-webkit-scrollbar { height:6px; }
.actors-section::-webkit-scrollbar-thumb {
  background: #ff4500;
  border-radius:4px;
}
.actor-card {
  flex:0 0 auto;
  width:90px;
  display:flex;
  flex-direction:column;
  align-items:center;
  cursor:pointer;
}
.actor-card img {
  width:100%;
  height:120px;
  object-fit:cover;
  border-radius:10px;
  border:2px solid #ff4500;
  box-shadow:0 5px 15px rgba(255,69,0,0.5);
}
.actor-card h3 {
  margin-top:6px;
  font-size:12px;
  text-align:center;
  color:#ff4500;
}

/* === VIDEO PLAYER === */
.player {
  width:100%;
  max-width:100%;
  position:relative;
  padding-top:56.25%;
  border-radius:10px;
  overflow:hidden;
  margin-bottom:15px;
}
.player video {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
}

/* === TITLE === */
#movie-title {
  font-size:1.5rem;
  font-weight:700;
  margin:10px 0;
  text-align:center;
}

/* === CATEGORIES === */
.grid-categories {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.card-category {
  padding:5px 14px;
  background: linear-gradient(135deg,#ff4500,#ffd700);
  border-radius:20px;
}

/* === SIMILAR === */
#similar-movies {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.similar-card img {
  width:100%;
  height:150px;
  object-fit:cover;
}
</style>

</head>
<body>

<div class="actors-section" id="actors"></div>

<div class="player">
  <video id="movie-video" controls playsinline></video>
</div>

<div id="movie-title"></div>

<div class="grid-categories" id="categories"></div>

<div id="similar-movies"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="data.js"></script>
<script src="https://cdn.fluidplayer.com/v3/current/fluidplayer.min.js"></script>

<script>
function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

function renderMovie(){
  const movieId = getParam("id");
  const movie = movies[movieId] || movies[0];

  const videoEl = document.getElementById("movie-video");

  if(movie.video.endsWith(".m3u8") && Hls.isSupported()){
    const hls = new Hls();
    hls.loadSource(movie.video);
    hls.attachMedia(videoEl);
  } else {
    videoEl.src = movie.video;
  }

  document.getElementById("movie-title").textContent = movie.title;

  const actorsEl = document.getElementById("actors");
  actorsEl.innerHTML = "";
  movie.actors.forEach(a=>{
    const div = document.createElement("div");
    div.className="actor-card";
    div.innerHTML=`<img src="${a.image}"><h3>${a.name}</h3>`;
    actorsEl.appendChild(div);
  });

  const catEl=document.getElementById("categories");
  catEl.innerHTML="";
  movie.categories.forEach(c=>{
    const div=document.createElement("div");
    div.className="card-category";
    div.textContent=c;
    catEl.appendChild(div);
  });
}

renderMovie();

/* =========================
   🔥 FIXED FLUID PLAYER
========================= */
window.addEventListener("load", function () {

  const player = fluidPlayer("movie-video", {
    layoutControls: {
      autoPlayAfterAd: true,
      finishVideoToShowPoster: false
    },
    vastOptions: {
      adList: [
        {
          roll: "preRoll",
          vastTag: "https://s.magsrv.com/v1/vast.php?idz=5954624"
        }
      ]
    }
  });

  const video = document.getElementById("movie-video");

  // 🔥 Skip bosilganda yoki ad tugaganda video davom etadi
  document.addEventListener("click", function () {
    if (video.paused) {
      video.play();
    }
  });

});
</script>

</body>
</html>
