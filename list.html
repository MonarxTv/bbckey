<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <title>Movie Details</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Client Hints Meta Tag -->
  <meta http-equiv="Delegate-CH" content="Sec-CH-UA https://s.magsrv.com; Sec-CH-UA-Mobile https://s.magsrv.com; Sec-CH-UA-Arch https://s.magsrv.com; Sec-CH-UA-Model https://s.magsrv.com; Sec-CH-UA-Platform https://s.magsrv.com; Sec-CH-UA-Platform-Version https://s.magsrv.com; Sec-CH-UA-Bitness https://s.magsrv.com; Sec-CH-UA-Full-Version-List https://s.magsrv.com; Sec-CH-UA-Full-Version https://s.magsrv.com;">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Video.js CSS -->
  <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />

  <style>
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:'Montserrat', sans-serif;
      background:#121212;
      color:#fff;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:10px;
      width:100%;
    }
    #movie-title {
      font-size:1.5rem;
      font-weight:700;
      margin:10px 0;
      text-align:center;
      background: linear-gradient(90deg,#ff4500,#ffd700);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow:2px 2px 5px rgba(0,0,0,0.7);
    }
    .player {
      width:100%;
      max-width:100%;
      margin-bottom:20px;
    }
    .actors-section {
      display:inline-flex;
      gap:10px;
      overflow-x:auto;
      padding:10px 0;
      margin-bottom:15px;
    }
    .actor-card {
      flex:0 0 auto;
      width:90px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }
    .actor-card img {
      width:100%;
      height:120px;
      object-fit:cover;
      border-radius:10px;
      border:2px solid #ff4500;
    }
    .actor-card h3 {
      margin-top:6px;
      font-size:12px;
      text-align:center;
      color:#ff4500;
    }
    .grid-categories {
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-bottom:20px;
      width:100%;
    }
    .card-category {
      padding:5px 14px;
      background: linear-gradient(135deg,#ff4500,#ffd700);
      border-radius:20px;
      color:#fff;
      font-size:12px;
    }
    #similar-movies {
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(120px,1fr));
      gap:10px;
      width:100%;
      margin-bottom:30px;
    }
    .similar-card {
      border-radius:10px;
      overflow:hidden;
      background:#1f1f1f;
      display:flex;
      flex-direction:column;
      cursor:pointer;
    }
    .similar-card img { width:100%; height:150px; object-fit:cover; }
    .similar-card h3 { text-align:center; color:#ff4500; margin:5px; font-size:12px; }
  </style>
</head>
<body>

<!-- VIDEO PLAYER -->
<div class="player">
  <video id="movie-video" class="video-js vjs-default-skin" controls preload="auto" width="720" height="405"></video>
</div>

<!-- MOVIE TITLE -->
<div id="movie-title"></div>

<!-- ACTORS -->
<div class="actors-section" id="actors"></div>

<!-- CATEGORIES -->
<div class="grid-categories" id="categories"></div>

<!-- SIMILAR MOVIES -->
<div id="similar-movies"></div>

<!-- Scripts -->
<script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/videojs-contrib-ads@6.9.0/dist/videojs-contrib-ads.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/videojs-vast-vpaid@2.1.0/dist/videojs-vast-vpaid.min.js"></script>
<script src="data.js"></script>
<script>
function getParam(name){return new URLSearchParams(window.location.search).get(name);}

function renderMovie(){
  const movieId = getParam("id");
  const movie = movies[movieId] || movies.find((m,i)=> i==movieId || m.title==movieId) || movies[0];
  if(!movie) return;

  // Title
  document.getElementById("movie-title").textContent = movie.title;

  // Video.js player
  var player = videojs('movie-video');
  player.vastClient({
    adTagUrl: 'https://s.magsrv.com/v1/vast.php?idz=5954624',
    playAdAlways: true,
    adCancelTimeout: 5000,
    adsEnabled: true
  });

  // Stream manzilini yuklash
  if(movie.video.endsWith(".m3u8")){
    player.src({ src: movie.video, type: "application/x-mpegURL" });
  } else {
    player.src({ src: movie.video, type: "video/mp4" });
  }

  // Actors
  const actorsEl = document.getElementById("actors");
  actorsEl.innerHTML = "";
  movie.actors.forEach(a=>{
    const div = document.createElement("div");
    div.className="actor-card";
    div.innerHTML = `<img src="${a.image}" alt="${a.name}"><h3>${a.name}</h3>`;
    actorsEl.appendChild(div);
  });

  // Categories
  const categoriesEl = document.getElementById("categories");
  categoriesEl.innerHTML="";
  movie.categories.forEach(c=>{
    const div = document.createElement("div");
    div.className="card-category";
    div.textContent=c;
    categoriesEl.appendChild(div);
  });

  // Similar Movies
  const similarEl = document.getElementById("similar-movies");
  similarEl.innerHTML="";
  const actorMatches = movies.filter(m=> m !== movie && m.actors.some(a=> movie.actors.map(x=>x.name).includes(a.name)));
  const categoryMatches = movies.filter(m=> m !== movie && !actorMatches.includes(m) && m.categories.some(c=> movie.categories.includes(c)));
  [...actorMatches, ...categoryMatches].slice(0,4).forEach(f=>{
    const div = document.createElement("div");
    div.className="similar-card";
    div.innerHTML=`<img src="${f.thumbnail}" alt="${f.title}"><h3>${f.title}</h3>`;
    div.onclick=()=>window.location.href=`list.html?id=${f.title}`;
    similarEl.appendChild(div);
  });
}

renderMovie();
</script>
</body>
</html>
