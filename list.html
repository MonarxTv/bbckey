<!DOCTYPE html>
<html lang="uz">
<head>
  <meta http-equiv="Delegate-CH" content="Sec-CH-UA https://s.magsrv.com; Sec-CH-UA-Mobile https://s.magsrv.com; Sec-CH-UA-Arch https://s.magsrv.com; Sec-CH-UA-Model https://s.magsrv.com; Sec-CH-UA-Platform https://s.magsrv.com; Sec-CH-UA-Platform-Version https://s.magsrv.com; Sec-CH-UA-Bitness https://s.magsrv.com; Sec-CH-UA-Full-Version-List https://s.magsrv.com; Sec-CH-UA-Full-Version https://s.magsrv.com;">
<meta charset="UTF-8">
<title>Movie Details</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family:'Montserrat', sans-serif;
  background:#121212;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:10px;
  width:100%;
}

/* ACTORS */
.actors-section {
  display:inline-flex;
  gap:10px;
  overflow-x:auto;
  padding:10px 0;
  margin-bottom:15px;
  min-width:100%;
}
.actor-card {
  flex:0 0 auto;
  width:90px;
  display:flex;
  flex-direction:column;
  align-items:center;
  cursor:pointer;
}
.actor-card img {
  width:100%;
  height:120px;
  object-fit:cover;
  border-radius:10px;
  border:2px solid #ff4500;
}
.actor-card h3 {
  font-size:12px;
  color:#ff4500;
  text-align:center;
}

/* PLAYER */
.player {
  width:100%;
  position:relative;
  padding-top:56.25%;
  overflow:hidden;
  border-radius:10px;
}
.player video {
  position:absolute;
  top:0; left:0;
  width:100%;
  height:100%;
}

/* TITLE */
#movie-title {
  font-size:1.5rem;
  text-align:center;
  margin:10px 0;
  color:#ffd700;
}

/* CATEGORIES */
.grid-categories {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}
.card-category {
  padding:5px 10px;
  background:#ff4500;
  border-radius:20px;
  cursor:pointer;
}

/* SIMILAR */
#similar-movies {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  width:100%;
}
.similar-card img {
  width:100%;
  height:150px;
  object-fit:cover;
}
</style>
</head>

<body>

<div class="actors-section" id="actors"></div>

<div class="player">
  <video id="movie-video" controls playsinline></video>
</div>

<div id="movie-title"></div>

<div class="grid-categories" id="categories"></div>

<div id="similar-movies"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="data.js"></script>

<script src="https://cdn.fluidplayer.com/v3/current/fluidplayer.min.js"></script>

<script>
function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

function renderMovie(){
  const movieId = getParam("id");
  const movie = movies[movieId] || movies[0];

  const videoEl = document.getElementById("movie-video");

  // VIDEO LOAD
  if(movie.video.endsWith(".m3u8") && Hls.isSupported()){
    const hls = new Hls();
    hls.loadSource(movie.video);
    hls.attachMedia(videoEl);
  } else {
    videoEl.src = movie.video;
  }

  document.getElementById("movie-title").textContent = movie.title;

  // ACTORS
  const actorsEl = document.getElementById("actors");
  actorsEl.innerHTML = "";
  movie.actors.forEach(a=>{
    const div = document.createElement("div");
    div.className="actor-card";
    div.innerHTML=`<img src="${a.image}"><h3>${a.name}</h3>`;
    actorsEl.appendChild(div);
  });

  // CATEGORIES
  const catEl = document.getElementById("categories");
  catEl.innerHTML="";
  movie.categories.forEach(c=>{
    const div=document.createElement("div");
    div.className="card-category";
    div.textContent=c;
    catEl.appendChild(div);
  });
}

renderMovie();

// FLUID PLAYER + SKIP FIX
window.addEventListener("load", function () {
  const player = fluidPlayer("movie-video", {
    layoutControls: {
      autoPlayAfterAd: true
    },
    vastOptions: {
      adList: [
        {
          roll: "preRoll",
          vastTag: "https://s.magsrv.com/v1/vast.php?idz=5954624"
        }
      ]
    }
  });

  // SKIP BO‘LGANDA VIDEO DAVOM ETADI
  document.addEventListener("adskipped", function () {
    const video = document.getElementById("movie-video");
    video.play();
  });
});
</script>

</body>
</html>
