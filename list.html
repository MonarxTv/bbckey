<!DOCTYPE html>
<html lang="uz">
<head>
  <meta http-equiv="Delegate-CH" content="Sec-CH-UA https://s.magsrv.com; Sec-CH-UA-Mobile https://s.magsrv.com; Sec-CH-UA-Arch https://s.magsrv.com; Sec-CH-UA-Model https://s.magsrv.com; Sec-CH-UA-Platform https://s.magsrv.com; Sec-CH-UA-Platform-Version https://s.magsrv.com; Sec-CH-UA-Bitness https://s.magsrv.com; Sec-CH-UA-Full-Version-List https://s.magsrv.com; Sec-CH-UA-Full-Version https://s.magsrv.com;">
<meta charset="UTF-8">
<title>Movie Details</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family:'Montserrat', sans-serif;
  background:#121212;
  color:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:10px;
  width:100%;
}

.actors-section {
  display:inline-flex;
  gap:10px;
  overflow-x:auto;
  padding:10px 0;
  margin-bottom:15px;
  scroll-behavior:smooth;
  justify-content:flex-start;
  min-width:100%;
}

.actor-card {
  flex:0 0 auto;
  width:90px;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.actor-card img {
  width:100%;
  height:120px;
  object-fit:cover;
  border-radius:10px;
  border:2px solid #ff4500;
}

.player {
  width:100%;
  position:relative;
  padding-top:56.25%;
  border-radius:10px;
  overflow:hidden;
}

.player video {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
}

#movie-title {
  font-size:1.5rem;
  font-weight:700;
  margin:10px 0;
  text-align:center;
}
</style>
</head>

<body>

<div class="actors-section" id="actors"></div>

<div class="player">
  <video id="movie-video" controls playsinline></video>
</div>

<div id="movie-title"></div>

<div id="categories"></div>
<div id="similar-movies"></div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="data.js"></script>
<script src="https://cdn.fluidplayer.com/v3/current/fluidplayer.min.js"></script>

<script>
function getParam(name){
  return new URLSearchParams(window.location.search).get(name);
}

const videoEl = document.getElementById("movie-video");
let hls;
let player;

/* ===================== VIDEO LOAD ===================== */
function loadVideo(url){

  if(hls){
    hls.destroy();
    hls = null;
  }

  if(url.includes(".m3u8") && Hls.isSupported()){

    hls = new Hls();
    hls.loadSource(url);
    hls.attachMedia(videoEl);

    hls.on(Hls.Events.MANIFEST_PARSED, ()=>{
      videoEl.muted = true;
      videoEl.play();
    });

  } else {
    videoEl.src = url;
    videoEl.muted = true;
    videoEl.play();
  }
}

/* ===================== MOVIE ===================== */
function renderMovie(){

  const titleEl = document.getElementById("movie-title");
  const actorsEl = document.getElementById("actors");
  const categoriesEl = document.getElementById("categories");
  const similarEl = document.getElementById("similar-movies");

  const movieId = getParam("id");
  const movie = movies[movieId] || movies.find((m,i)=>i==movieId || m.title==movieId) || movies[0];

  if(!movie) return;

  /* TITLE */
  titleEl.textContent = movie.title;

  /* VIDEO LOAD (🔥 MUHIM QO‘SHILDI) */
  loadVideo(movie.video);

  /* ACTORS */
  actorsEl.innerHTML = "";
  movie.actors.forEach(a=>{
    const div = document.createElement("div");
    div.className="actor-card";
    div.innerHTML = `<img src="${a.image}"><h3>${a.name}</h3>`;
    actorsEl.appendChild(div);
  });

  /* CATEGORIES */
  categoriesEl.innerHTML="";
  movie.categories.forEach(c=>{
    const div = document.createElement("div");
    div.textContent = c;
    categoriesEl.appendChild(div);
  });

  renderSimilarMovies(movie, similarEl);
}

/* ===================== SIMILAR ===================== */
function renderSimilarMovies(movie, container){
  container.innerHTML="";

  const actorMatches = movies.filter(m=>
    m!==movie && m.actors.some(a=>movie.actors.map(x=>x.name).includes(a.name))
  );

  const categoryMatches = movies.filter(m=>
    m!==movie && !actorMatches.includes(m) &&
    m.categories.some(c=>movie.categories.includes(c))
  );

  const combined = [...actorMatches, ...categoryMatches].slice(0,4);

  combined.forEach(f=>{
    const div = document.createElement("div");
    div.innerHTML = `<img src="${f.thumbnail}"><h3>${f.title}</h3>`;
    container.appendChild(div);
  });
}

/* ===================== FLUID PLAYER ===================== */
window.addEventListener("load", function(){

  player = fluidPlayer("movie-video", {
    layoutControls:{
      autoPlay:false,
      mute:true
    },
    vastOptions:{
      adList:[
        {
          roll:"preRoll",
          vastTag:"https://s.magsrv.com/v1/vast.php?idz=5954624",
          skippable:true,
          skipOffset:5,
          skipButtonCaption:"Skip"
        }
      ]
    }
  });

  /* 🔥 SKIP BOSILSA VIDEO BOSHLANADI */
  player.on("vastComplete", function(){
    videoEl.play();
  });

  renderMovie();
});
</script>

</body>
</html>
